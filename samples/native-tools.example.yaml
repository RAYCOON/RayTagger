# Native-tool manifest — used by Tagger's auto-bootstrap to download the
# analysis binaries on first use, instead of forcing the user to install
# them manually. Copy to `native-tools.yaml` next to your `tagger.yaml`
# (or anywhere referenced by `native_tools.manifest_file` in tagger.yaml).
#
# IMPORTANT: This is the CONTRACT between Tagger and the binaries it
# downloads. Every entry is verified by SHA-256 before extraction. If
# upstream releases a new version, bump `version:` AND replace the hashes
# — Tagger never trusts a download just because the URL looks familiar.
#
# How to generate a SHA-256 from a published download:
#   curl -sL <URL> | shasum -a 256          # macOS / Linux
#   (Get-FileHash -A SHA256 file).Hash.ToLower()   # Windows PowerShell
#
# Supported archive_format values: tar_gz, zip, none
#   none       — URL points at the bare binary (no extraction)
#   tar_gz     — .tar.gz archive; binary_path is the path WITHIN the archive
#   zip        — .zip archive; binary_path is the path WITHIN the archive
#
# The keys under `tools:` MUST match the bare binary name Tagger looks up
# (the same name an installed copy would have on PATH). The keys under
# `sources:` are .NET runtime identifiers: osx-arm64, osx-x64, linux-x64,
# linux-arm64, win-x64, win-arm64.

schema_version: 1

# Override the cache root. Empty/null = OS default:
#   macOS    ~/Library/Application Support/RayTagger/tools
#   Linux    ~/.local/share/RayTagger/tools
#   Windows  %LOCALAPPDATA%\RayTagger\tools
cache_directory: ""

tools:

  # --- Essentia (BPM, key, energy) ---------------------------------------------
  # Upstream: https://essentia.upf.edu/documentation/extractors/
  #
  # NOTE: the MTG-hosted prebuilt binaries are version 2.1-beta2 from
  # January 2020 — they work but lag behind master by several years and
  # only cover three platforms. Apple Silicon (osx-arm64), Linux arm64
  # and Windows x86_64 have no official prebuilt; users on those targets
  # either run the x86_64 binary in compatibility mode (Rosetta / WoW64),
  # install via Homebrew, or build from source (see docs/INSTALL.md).
  #
  # The binary inside the archive is named `streaming_extractor_music`
  # (without the `essentia_` prefix). Tagger renames it to the canonical
  # `essentia_streaming_extractor_music` when moving into the cache slot,
  # so the bare-name probe / setup workflow keeps working.
  essentia_streaming_extractor_music:
    version: "master-20260416-7e90d20b"
    sources:
      osx-x64:
        url: "https://essentia.upf.edu/extractors/essentia-extractors-v2.1_beta2-osx-x86_64.tar.gz"
        sha256: "478644eb6aa5c6363dedf8c76c0749d617d0c534a79104ee737b0a1ca779efd0"
        archive_format: tar_gz
        binary_path: "essentia-extractors-v2.1_beta2/streaming_extractor_music"
      linux-x64:
        url: "https://github.com/RAYCOON/raytagger/releases/download/essentia-tools-20260416/essentia-20260416-7e90d20b-linux-x64.tar.gz"
        sha256: "28b877109b1d8031b07282ef635218796dd6532b87dc1d50feb828aabfbf8342"
        archive_format: tar_gz
        binary_path: "essentia_streaming_extractor_music"
      # Windows note: upstream only publishes a 32-bit (i686) build. It
      # runs on 64-bit Windows via WoW64, so we wire it under BOTH win-x64
      # (where Tagger usually runs) and win-x86 (32-bit hosts). If you
      # have a self-built native 64-bit essentia_streaming_extractor_music.exe,
      # host it on your own mirror and override the win-x64 entry here.
      win-x64:
        url: "https://github.com/RAYCOON/raytagger/releases/download/essentia-tools-20260416/essentia-20260416-7e90d20b-win-x64.tar.gz"
        sha256: "775a9ba6d883cd2125713e9179da91e8b86478ebb787c4d8466b8aa88599710f"
        archive_format: tar_gz
        binary_path: "essentia_streaming_extractor_music.exe"
      win-x86:
        url: "https://essentia.upf.edu/extractors/essentia-extractors-v2.1_beta2-win-i686.tar.gz"
        sha256: "33033d86825f94ed1386604271b72f7cd9d7c470746016bb1e53c34f9451e7ee"
        archive_format: tar_gz
        binary_path: "essentia-extractors-v2.1_beta2/streaming_extractor_music.exe"
      # The osx-arm64 entry below is auto-managed by
      # `.github/workflows/essentia-build.yml`. Its initial URL + SHA-256
      # are placeholders that fail on purpose — Tagger will refuse the
      # download until the workflow has run once and replaced these values
      # with the real GitHub-release artifact. Apple-Silicon users running
      # Tagger BEFORE that first workflow run must either build from
      # source (docs/INSTALL.md) or duplicate the osx-x64 entry here so
      # the x86_64 build runs under Rosetta.
      osx-arm64:
        url: "https://github.com/RAYCOON/raytagger/releases/download/essentia-tools-20260416/essentia-20260416-7e90d20b-osx-arm64.tar.gz"
        sha256: "b4b4ec514e0ee034c9b12d7a0c78e2642204ad5788442892a3e24435c42eba3f"
        archive_format: tar_gz
        binary_path: "essentia_streaming_extractor_music"
      #
      # linux-arm64: no upstream prebuilt and the CI workflow doesn't
      # cover it yet (no native arm64 GitHub Actions runner in the matrix).
      # If you need it, run the build script on your own arm64 Linux host
      # and host the tarball on a mirror you control.

  # --- Chromaprint / fpcalc (acoustic fingerprint for AcoustID) ----------------
  # Upstream: https://github.com/acoustid/chromaprint/releases
  # Version 1.6.0 (Aug 2025) is the first release with native arm64 builds
  # for both Linux and macOS — strongly preferred over 1.5.1.
  fpcalc:
    version: "1.6.0"
    sources:
      osx-arm64:
        url: "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-macos-arm64.tar.gz"
        sha256: "2c6c837f57ab5ad330710dc296af4de62a51d3c14aa2309fe1afce2ab699bd35"
        archive_format: tar_gz
        binary_path: "chromaprint-fpcalc-1.6.0-macos-arm64/fpcalc"
      osx-x64:
        url: "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-macos-x86_64.tar.gz"
        sha256: "5898f2442220f4d82920b9eb11c35fc30d379b1ce9cb8b9f869f3365d2236e99"
        archive_format: tar_gz
        binary_path: "chromaprint-fpcalc-1.6.0-macos-x86_64/fpcalc"
      linux-arm64:
        url: "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-linux-arm64.tar.gz"
        sha256: "c8667f556f77d8ebbe08b75a968c0592bd2a67aaa696eff91715feb5083b1cd4"
        archive_format: tar_gz
        binary_path: "chromaprint-fpcalc-1.6.0-linux-arm64/fpcalc"
      linux-x64:
        url: "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-linux-x86_64.tar.gz"
        sha256: "946dc3eade645eb835c8d163c6bb354e092239988bff190b9c42589e8d5cf00a"
        archive_format: tar_gz
        binary_path: "chromaprint-fpcalc-1.6.0-linux-x86_64/fpcalc"
      win-x64:
        url: "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-windows-x86_64.zip"
        sha256: "30179d3d0dc4cc92f1a0995c1a2e523fb4867724c2ee6a6ceae474f8e4d6937a"
        archive_format: zip
        binary_path: "chromaprint-fpcalc-1.6.0-windows-x86_64/fpcalc.exe"
      # No win-arm64 build upstream as of 1.6.0 — Windows-on-arm64 users
      # can run the x64 build under emulation (x64 on arm64 has been a
      # first-class scenario since Windows 11), but Tagger won't auto-bootstrap
      # that fallback. Add an explicit entry pointing at the win-x64 archive
      # if you want that behaviour.

# --- TensorFlow genre-classifier models (Phase B) ---------------------------
# These are optional — only downloaded when the matching flag in tagger.yaml
# under `analysis.genre_classifier.tensorflow.*.enabled` is true. Each model
# entry is platform-independent (.pb files run wherever TensorFlow does), so
# `sources:` is a flat list of files rather than a per-RID map.
#
# The cache layout is flat: <cacheRoot>/models/<model-key>/<files>. The Python
# bridge expects every file at that exact location, so when adding a new model
# entry make sure `rename_to:` (if used) produces the filename the script
# looks up — see tools/raytagger-genre-classifier/raytagger_genre_classifier.py.
#
# `version:` is a cache-bust marker — bumping it forces re-download on the
# next scan. SHA-256s are pinned from real downloads on 2026-05-22.
models:

  # 5-class electronic classifier. Two .pb files (embedding + head) + metadata
  # JSON renamed to labels.json. Used by `tensorflow.genre_electronic.enabled`.
  electronic:
    version: "1"
    files:
      - url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb"
        sha256: "3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1"
      - url: "https://essentia.upf.edu/models/classification-heads/genre_electronic/genre_electronic-discogs-effnet-1.pb"
        sha256: "a479f5b4db4fee5f4e76838cd62200754e20494975bb541184fc5d696d2763ef"
      - url: "https://essentia.upf.edu/models/classification-heads/genre_electronic/genre_electronic-discogs-effnet-1.json"
        sha256: "11dcd6e511a46bc19b3c0a7a3860b0535bad4c30798bde4421e815c519d75602"
        rename_to: "labels.json"

  # 87-class MTG Jamendo tagger. Shares the discogs-effnet embedding with the
  # `electronic` and `discogs-effnet` models — yes, that means we redundantly
  # download the 18 MB embedding file three times. Acceptable for v1; dedup is
  # a future optimisation if disk pressure ever shows up.
  jamendo:
    version: "1"
    files:
      - url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb"
        sha256: "3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1"
      - url: "https://essentia.upf.edu/models/classification-heads/mtg_jamendo_genre/mtg_jamendo_genre-discogs-effnet-1.pb"
        sha256: "a46f94fd85b03b403d6498a820e3ee652e05a24fc2a344d84545ac36224e698e"
      - url: "https://essentia.upf.edu/models/classification-heads/mtg_jamendo_genre/mtg_jamendo_genre-discogs-effnet-1.json"
        sha256: "b0ae89110ddbdba5ed3ad375910b1cffc738436fbb4138ac4c2801b48fc5ec59"
        rename_to: "labels.json"

  # 400-class discogs-effnet style classifier — single-stage, the same .pb is
  # the classifier (not an embedding). Plus its own metadata JSON.
  discogs-effnet:
    version: "1"
    files:
      - url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb"
        sha256: "3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1"
      - url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.json"
        sha256: "a35003202384735c33154e20264267f9941705218a7b93202b655a1d408d4ff6"
        rename_to: "labels.json"

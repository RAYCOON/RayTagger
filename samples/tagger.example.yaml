# RayTagger — main configuration.
# Copy to ./tagger.yaml and adjust.
#
# Path normalisation (applied to every path value):
#   "~" or "~/foo"        → user home (cross-platform)
#   "./foo", "../foo"     → relative to THIS file's directory, not CWD
#   Env-var placeholders  → use ${env:NAME} syntax (see api_keys section below for
#                           live examples). Substituted at load time; load fails
#                           loud with the YAML path if a required var is missing.
#
# Cache directory default (when lookup.cache.directory is empty) is OS-aware:
#   macOS   ~/Library/Application Support/RayTagger/cache
#   Linux   ~/.local/share/RayTagger/cache
#   Windows %LOCALAPPDATA%\RayTagger\cache

version: 1

# --- 1. Scan -----------------------------------------------------------------
scan:
  source: "~/Music/incoming"        # root directory to walk
  recursive: true
  formats: [mp3, flac, aiff]        # extensions to include
  include_globs: []                 # optional: limit further (e.g. ["**/*Promo*"])
  exclude_globs:
    - "**/.DS_Store"
    - "**/iTunes/**"
  parallelism: 0                    # concurrent workers; 0 = auto (Environment.ProcessorCount), 1 = sequential

# --- 2. Reading existing tags ------------------------------------------------
# Existing-tag protection is now per-dimension via `existing_confidence` knobs (see below
# under analysis.* and lookup.*). The historical `read.existing_tags_policy` key has been
# removed; if a legacy config still has it, the loader migrates the value to the equivalent
# per-dimension defaults and prints a deprecation warning. See ARCHITECTURE.md §6.2 for the
# migration table.
read: {}

# --- 3. Audio analysis (offline, local binaries on PATH) ---------------------
# BPM, key and energy all run through a single Essentia
# `streaming_extractor_music` invocation per track — one fork+exec, three values.
# Essentia's EDMA key profile is trained on Beatport material and outperforms the
# Shaath profile (libKeyFinder) on DJ-oriented tracks; its rhythm tracker is more
# robust against the half/double-time errors aubio is known for. Fingerprinting
# stays on Chromaprint/fpcalc because AcoustID requires it.
#
# Each analyzer emits a confidence in [0,1]. Values below `min_confidence`
# are dropped (existing tag preserved). Set to 0 to always trust the analyzer.
#
# `existing_confidence` (per dimension, [0,1]) controls how easily an existing
# tag is overridden:
#   1.0  default — existing always wins (classic skip-if-present behaviour)
#   0.0  every usable analyzer hit overrides
#   x    analyzer wins only when its own confidence > x
#
# CLI convenience: `tagger scan --force-overwrite` zeroes every existing_confidence
# for one run (BPM, Key, Energy, Lookup) without editing this file. Use when
# re-tagging an entire library after a Tagger update or to test new defaults.
#
# Note on timeouts: bpm/key/energy share ONE Essentia run, so the effective
# timeout is the MAX of the three values. Setting bpm.timeout_seconds=30 while
# energy.timeout_seconds=60 still gives Essentia 60s — there's no way to abort
# the BPM dimension early because all three come out of the same JSON.
analysis:
  bpm:
    enabled: true
    provider: essentia               # only essentia is supported
    timeout_seconds: 60
    min_confidence: 0.4              # bpm_histogram_first_peak_weight proxy
    # Snap BPM to the nearest multiple of `snap_step` when within `snap_tolerance_percent`
    # drift. Applied to the final resolved BPM (existing tag OR analyzer output) so values
    # like a disk "126.01" or Essentia's "122.07" both end up on the grid the user sees.
    # snap_step 0.5 also catches half-BPM tracks (173.48 → 173.5); use 1.0 for integer-only.
    snap_tolerance_percent: 0.12
    snap_step: 0.5
    # Per-genre snap-step overrides. Looked up case-insensitively against the resolved genre
    # (same normalisation as tempo_ranges_by_genre). Useful when one genre's tempos are
    # inherently coarser than the rest — e.g. Pop/Rock at integers, DnB needing finer
    # resolution (174.5 vs 174 matters for harmonic mixing). Empty = global snap_step is used
    # for every genre.
    snap_step_by_genre: {}
    # Example:
    # snap_step_by_genre:
    #   Drum and Bass: 0.25
    #   Rock:          1.0
    #   Pop:           1.0

    # Per-genre BPM ranges. Essentia ALWAYS runs with its built-in default tempo range
    # (40-208) — these ranges are applied AFTER detection by a fold algorithm:
    #
    #   1. Existing genre tag is normalised via taxonomy.normalise (e.g. "Tech House" → "House").
    #   2. The normalised name is looked up here (case-insensitive).
    #   3. No match → tempo_range_fallback (below) → if also unset, no fold; raw is passed through.
    #
    # Fold rules per track:
    #   raw ∈ [min, max]            → snap(raw) and write          (normal)
    #   raw < min                   → snap(raw × 2); if still out of range, write snap(raw) DARK BLUE
    #   raw > max                   → snap(raw ÷ 2); if still out of range, write snap(raw) DARK BLUE
    #
    # The fold replaces the previous transient-profile-YAML + `post: double / halve_above_100`
    # mechanism. The DJ-convention edge cases (Drum and Bass full-time at 172, DubStep half-time
    # at 77) now resolve automatically:
    #   raw 86 BPM   tagged Drum and Bass [130, 200] → fold ×2 → 172
    #   raw 154 BPM  tagged DubStep      [50, 100]  → fold ÷2 → 77
    #
    # Wrong-genre-tag material lands in the dark-blue fallback (snap of the raw signal) so the
    # mismatch is visible rather than silently forced into the wrong octave.
    tempo_ranges_by_genre:
      house:          { min: 110, max: 140 }
      techno:         { min: 110, max: 150 }
      trance:         { min: 120, max: 170 }
      dubstep:        { min: 50,  max: 100 }   # half-time DJ convention
      drum and bass:  { min: 130, max: 200 }   # full-time DJ convention
      hip hop:        { min: 75,  max: 105 }
      disco:          { min: 100, max: 125 }
      hardstyle:      { min: 140, max: 180 }
      garage:         { min: 125, max: 140 }
      reggaeton:      { min: 85,  max: 100 }

    # Fallback range when the genre matches none of the above (or when a track has no genre tag).
    # null = no fold attempted; raw Essentia value passes through with only the snap-to-grid pass.
    tempo_range_fallback: null
  key:
    enabled: true
    provider: essentia               # uses tonal.key_edma (EDM-trained profile)
    timeout_seconds: 60
    min_confidence: 0.55
    # Key notation is policy: TKEY is written in STANDARD notation per ID3
    # spec; TXXX:CAMELOTKEY is written in Camelot. Both are written when key
    # analysis is enabled — this option only controls CLI/log display.
    display_notation: camelot        # camelot | standard
    # Which of Essentia's three key profiles to use. Essentia always emits all three (free).
    #   edma                  — DJ-tuned, strongest on EDM/Beatport (default, backward-compat)
    #   temperley             — better than EDMA on rock / pop / jazz
    #   krumhansl             — classical-trained tonal-hierarchy model
    #   edma_with_fallback    — EDMA when strength ≥ edma_with_fallback_threshold (default 0.5),
    #                            otherwise the stronger of Temperley / Krumhansl
    #   ensemble_voting       — pick the key two of three profiles agree on; tiebreak by strength.
    #                            Recommended for mixed libraries — the 1795-track backtest showed
    #                            EDMA-only at 37 % exact match across non-EDM material.
    profile: edma
    edma_with_fallback_threshold: 0.5
  energy:
    enabled: true
    provider: essentia               # five-feature composite (flux/beats/onset/dance/loudness)
    timeout_seconds: 60
    scale: 1-10
    min_confidence: 0.5
    # Optional per-library calibration profile. Generated by `tagger calibrate-energy <folder>`
    # or the UI "Energie kalibrieren…" button. Re-tagging existing files after a (re-)calibration
    # is the user's responsibility — Tagger never rewrites tags silently.
    # Set to empty string to disable calibration and always use the built-in defaults.
    calibration_file: ./energy-calibration.yaml
  fingerprint:
    enabled: true                    # required if lookup is enabled
    provider: chromaprint            # shells out to `fpcalc`
    timeout_seconds: 30
    min_confidence: 0.0              # fingerprint is binary — present or not

  # Audio-based genre classification. See docs/PLAN_GENRE_CLASSIFICATION.md.
  # Heuristic is ON by default (reuses existing Essentia run, near-zero extra cost).
  # TF models default to off — pip install essentia-tensorflow and flip the desired model
  # to true to opt in.
  genre_classifier:
    heuristic:
      # tier-3 pure-rule scoring over DSP descriptors — reuses existing Essentia run, no extra
      # subprocess cost. EDM-FOCUSED 8-genre lineup: House / Techno / Trance / Drum and Bass /
      # Dubstep / Hip Hop / Ambient / Downtempo. Rock/Pop/Jazz/R&B/Soul/Funk/Reggae/Classical
      # have no DSP signature here — use the mtg_jamendo TF model below if your library has
      # non-EDM material.
      enabled: true
      min_confidence: 0.55           # below this no candidate is emitted
      # How to combine the 7 per-feature scores. The 1795-track backtest showed the heuristic
      # is permissive (Precision 0.48) at arithmetic_mean — geometric_mean penalises weak
      # features more strongly. When switching, re-tune min_confidence downward (try 0.40).
      scoring_mode: arithmetic_mean  # arithmetic_mean | geometric_mean
    tensorflow:
      # Each model is independently toggleable AND has its own confidence floor — tune per
      # model to match how much trust you give it. Defaults differ on purpose; see comments.
      genre_electronic:
        enabled: false               # 5-class electronic classifier (ambient/dnb/house/techno/trance)
        min_confidence: 0.65         # higher floor — overlaps fully with the Phase A heuristic,
                                     # so we only want strong second-opinion hits
      mtg_jamendo:
        enabled: false               # 87-class Jamendo tagger — Rock/Pop/Soul/Jazz/Reggae/...
        min_confidence: 0.50         # lower floor — wider vocabulary, 0.5 already represents
                                     # strong confidence across 87 classes
        # Aggregation defaults ON for mtg_jamendo (same diffuse-output rationale as discogs-effnet):
        # 87 sibling classes spread mass over parents like Rock/Pop, so the parent-sum is more
        # robust than raw top-1. Threshold 0.30 (slightly higher than discogs's 0.25) because
        # Jamendo's parent classes are coarser — a clear winner should clear a wider bar.
        aggregate_top_k: true
        aggregate_per_candidate_floor: 0.02
        aggregate_min_total: 0.30
        aggregate_fallback_on_diffuse: true
      discogs_effnet:
        enabled: false               # 400-class fine-grained Discogs styles — subgenre detection
        min_confidence: 0.50         # lower floor — only source of subgenres in the pipeline
        # Aggregation across fine-grained classes (see PLAN §4.0c). When ON, the classifier sums
        # the top-K probabilities per taxonomy parent genre and emits the winner as an
        # aggregated candidate (source suffix `:aggregated`) in addition to the raw top-K.
        # Captures tracks where the 400 classes spread confidence over many subgenres of the
        # same parent — current top-1 picks would miss this signal.
        # Default-on for discogs-effnet only; the 5-class genre_electronic and 87-class jamendo
        # don't benefit because their top-1 already corresponds to a parent-level genre.
        aggregate_top_k: true
        # Per-candidate floor for inclusion in the aggregation sum. Long-tail predictions
        # (p < this value) are filtered out so they can't dilute the parent-genre signal.
        aggregate_per_candidate_floor: 0.02
        # A parent genre must aggregate at least this share of the top-K mass to count as a
        # "clear winner" and emit. Default 0.25 reflects the heuristic "≥1/4 of the considered
        # probability mass belongs to one parent". Diffuse output (no parent above threshold)
        # falls through to fallback or drops — see below.
        aggregate_min_total: 0.25
        # Behaviour when no parent clears aggregate_min_total: TRUE emits the highest-sum
        # parent anyway with source suffix `:aggregated-fallback` so the trace shows the
        # uncertainty (better best-guess than no answer for tagging). FALSE: no aggregated
        # candidate at all, raw top-K still emits.
        aggregate_fallback_on_diffuse: true
      python_executable: ""          # empty = `python3` via PATH
      script_path: ""                # empty = auto-discover next to tagger
      models_directory: ""           # empty = <local-app-data>/RayTagger/models/

# --- 4. Online lookup (hybrid: works offline, enriches when online) ---------
lookup:
  enabled: true
  online_required: false             # if true, fail when offline
  providers:                         # order = priority
    - acoustid                       # needs ACOUSTID_API_KEY
    - musicbrainz                    # free; rate limit 1 req/s enforced
    - discogs                        # needs DISCOGS_TOKEN
    - lastfm                         # needs LASTFM_API_KEY
  cache:
    enabled: true
    directory: ""                    # empty = OS-appropriate default (see header)
    ttl_days: 30
  api_keys:
    acoustid: "${env:ACOUSTID_API_KEY}"
    discogs:  "${env:DISCOGS_TOKEN}"
    lastfm:   "${env:LASTFM_API_KEY}"

  # MusicBrainz requires every client to identify itself with a User-Agent string that contains
  # a contact (URL or email) the MB ops team can reach in case of misbehaviour — see
  #   https://musicbrainz.org/doc/MusicBrainz_API/Rate_Limiting
  # Tagger always sends "RayTagger/<version> ( <contact> )". When this field is empty, the
  # default is the public project repo (https://github.com/RAYCOON/RayTagger). Override it when
  # you run a fork or an internal deployment where THAT contact is wrong for THIS install.
  # Examples:  "you@example.com"  or  "https://your-internal-wiki/raytagger"
  user_agent_contact: ""

  # New taxonomy-aware genre resolver (default on). When true, every API genre/sub-genre is
  # matched whole-word case-insensitive against taxonomy.yaml — longest match wins, the
  # canonical YAML casing is written, and existing tags that are already valid are protected
  # (see docs/ARCHITECTURE.md §Genre Resolution). Set false to fall back to "top-1 candidate
  # wins blindly" — useful only if you curate tags by other means.
  #
  # NOTE: this flag controls the AUTOMATIC lookup at scan time. The UI's per-track "API"
  # button always runs taxonomy resolution and always works as long as at least one provider
  # has credentials configured — it deliberately ignores `enabled` and this flag.
  taxonomy_resolution: true

  # Combine candidates that multiple providers independently returned via Noisy-OR:
  # `c_combined = 1 − Π(1 − cᵢ)`. Captures the statistical insight that two independent
  # signals at 0.5 each beat a single signal at 0.8 (combined = 0.75 vs 0.80 is close;
  # at three providers each at 0.5 the combined is 0.875). Only fires when at least
  # two DISTINCT providers (not duplicate entries from the same source) agree on a value.
  # Source of combined candidates is `consensus(provider1,provider2,...)`.
  # Default off — turn on after running `tagger validate` and confirming the Resolver-
  # Trace section shows overlapping providers on your library.
  consensus_boost: false

  # Existing-tag confidence floor for the LEGACY lookup-merge path (only fires when
  # taxonomy_resolution=false or no taxonomy is loaded). Same semantics as the per-analyzer
  # `existing_confidence` floors under `analysis.*`:
  #   1.0 (default) — existing genre always wins (classic skip-if-present)
  #   0.0           — any usable lookup candidate overrides existing
  #   x             — lookup candidate's confidence must clear x to win
  # Has no effect on the taxonomy-resolver path (which uses taxonomy-membership protection
  # instead, a binary by-design rule).
  existing_confidence: 1.0

  # Per-provider minimum interval between outbound requests (milliseconds). Defaults match the
  # published policies as of late 2025 — leave alone unless you have a reason to deviate:
  #   AcoustID    3 req/s per key       → 350 ms keeps us under (1000 / 3 ≈ 333 ms + headroom)
  #   MusicBrainz 1 req/s per IP+UA     → 1100 ms with safety margin; lower risks an IP block
  #   Discogs     60 req/min authed     → 1100 ms ≈ 54 req/min
  #   Last.fm     undocumented          → 200 ms (5 req/s), conservative
  # Increase when sharing a key across machines; decrease only if you have explicit upstream
  # permission. 0 disables client-side throttling entirely (don't — server-side bans are real).
  rate_limits:
    acoustid_ms:    350
    musicbrainz_ms: 1100
    discogs_ms:     1100
    lastfm_ms:      200

# --- 5. Mapping rules --------------------------------------------------------
mapping:
  rules_file: "./mappings.yaml"

  # Source-priority tiers used by TaxonomyGenreResolver when several candidates
  # match the same taxonomy entry. Higher tier wins; ties broken by confidence,
  # then YAML order of the taxonomy entry. Defaults (shown below) reflect the
  # design in docs/PLAN_GENRE_CLASSIFICATION.md §4.0d.
  #
  # Buckets (which candidate falls into which bucket) are hardcoded — only the
  # numeric weights are tunable. Range: [0, 1000].
  #
  #   provider                       MusicBrainz / Discogs / Last.fm / AcoustID
  #   classifier_aggregated          TF model + §4.0c bucket sum cleared min_total
  #   classifier_aggregated_fallback TF model with no bucket clearing min_total
  #                                  (top raw class kept as a hint, lower trust)
  #   classifier_tf_raw              Raw TF class without aggregation context
  #   classifier_other               Any other IGenreClassifier (e.g. future ones)
  #   classifier_heuristic           Tier-3 rule-based heuristic
  #
  # Common tweak: bump classifier_heuristic above classifier_tf_raw when you
  # trust the hand-tuned rules more than a raw TF prediction.
  #
  # Per-provider overrides (`providers:`) let you tune individual sources without
  # touching the generic `provider:` tier — useful when one provider's quality
  # on your library differs from the others (run `tagger validate` and check
  # the Resolver-Trace per-source win/loss table to decide). Names are
  # case-insensitive and must match the provider source string verbatim:
  # acoustid / musicbrainz / discogs / lastfm.
  source_priority:
    provider:                       100
    providers: {}                          # per-name overrides — example:
                                           # providers:
                                           #   musicbrainz: 110     # trust most
                                           #   lastfm:       40     # below classifier_heuristic — last-resort
    classifier_aggregated:           80
    classifier_aggregated_fallback:  70
    classifier_tf_raw:               60
    classifier_other:                55
    classifier_heuristic:            50

# --- 6. Tag writing ----------------------------------------------------------
write:
  dry_run: false                     # CLI --dry-run overrides this
  backup: true                       # write <file>.tagger.bak.yaml before changing

  # Logical field → format-specific frame. Defaults shown; override to customise.
  # Each value is a list — Tagger writes to all entries that apply to the file's
  # format. Format prefixes: ID3 (MP3/AIFF), VORBIS (FLAC).
  #
  # User-overridable rows (the TXXX descriptions and Vorbis field names):
  #   subgenre, camelot, energy, mood, set_position
  # Standard-frame rows (genre/bpm/key — TCON/TBPM/TKEY/INITIALKEY/GENRE/BPM)
  # are listed for documentation; the writer always uses the canonical frame
  # per spec. Listing a non-canonical standard frame yields a validation error.
  #
  # Mood + set_position are populated by mapping-rule `set:` blocks today —
  # no audio analyzer feeds them. See docs/FIELD_RESOLUTION.md §2.6 / §2.7.
  tag_fields:
    genre:        ["ID3:TCON",              "VORBIS:GENRE"]
    subgenre:     ["ID3:TXXX:SUBGENRE",     "VORBIS:SUBGENRE"]
    bpm:          ["ID3:TBPM",              "VORBIS:BPM"]
    key:          ["ID3:TKEY",              "VORBIS:INITIALKEY"]
    camelot:      ["ID3:TXXX:CAMELOTKEY",   "VORBIS:CAMELOTKEY"]
    energy:       ["ID3:TXXX:ENERGYLEVEL",  "VORBIS:ENERGYLEVEL"]
    mood:         ["ID3:TXXX:MOOD",         "VORBIS:MOOD"]
    set_position: ["ID3:TXXX:SETPOSITION",  "VORBIS:SETPOSITION"]

# --- 7. Sort (optional) ------------------------------------------------------
sort:
  enabled: false
  destination: "~/Music/library"
  pattern: "{genre}/{subgenre?}/{artist} - {title}.{ext}"
  conflict: rename                   # rename | skip | overwrite
  preserve_source: false             # if true: copy instead of move

# --- 8. Native tools (auto-bootstrap) ----------------------------------------
# Tagger orchestrates two native binaries — `essentia_streaming_extractor_music`
# and `fpcalc` — both of which the user would otherwise have to install
# manually. When `auto_bootstrap: true`, Tagger checks PATH first; if nothing
# is there it consults the manifest below, downloads + verifies + extracts
# the right binary for the current platform, and caches it under
#   <data-dir>/RayTagger/tools/<tool>/<version>/<rid>/
# so subsequent runs are offline. See `samples/native-tools.example.yaml`.
native_tools:
  # Path to the manifest YAML. Empty = look for `native-tools.yaml` next to
  # this file first, then next to the tagger executable. The manifest ships
  # with Tagger; pointing at a custom path is the way to host an internal
  # mirror without forking the project.
  manifest_file: "./native-tools.yaml"
  auto_bootstrap: true

# --- 9. Logging --------------------------------------------------------------
logging:
  level: information                 # verbose | debug | information | warning | error
  console: true
  file:
    enabled: true
    directory: "./logs"
  sqlite:
    enabled: false
    path: "./logs/tagger.db"         # uses Raycoon.Serilog.Sinks.SQLite

# RayTagger — mapping rules (sample / starting point).
#
# Rules sind in deklarierter Reihenfolge ausgewertet. Pro Match wird der `set:`-Block auf
# die in-flight ResolvedTrackTags angewendet. `on_match: continue` lässt nachfolgende
# Rules dieselbe Datei weiter bearbeiten — Standard ist `stop` (siehe `defaults.on_match`).
#
# Specificity-basiert: konkretere Rules (mit Subgenre + BPM + Key + Energy …) überschreiben
# generischere — Reihenfolge spielt für die *Auswahl* keine Rolle, nur für die Reihenfolge der
# Auswertung. Mehr in docs/ARCHITECTURE.md §5.
#
# `set:`-Werte aus der Source `Rules` ÜBERSCHREIBEN IMMER existing tags und ignorieren
# die per-Dimension `existing_confidence`-Schwellen. Das ist Absicht — Regeln sind der
# explizite deklarative Intent des Users.
#
# Erlaubte Werte für genre / subgenre / mood / set_position sind in taxonomy.yaml gelistet.
# Mit `enforce: true` validiert der Loader jeden `set:`-Wert beim Config-Load.
#
# Volle aktuelle Beispielregelmenge: ./config/mappings.yaml (gitignored, vom User gepflegt).
# Diese Datei zeigt das *Patternvokabular*, nicht die vollständige Coverage.
#
# Predicate-Keys unter `when:` — vollständige Liste in docs/ARCHITECTURE.md §5.2:
#   genre:          ["Name1", "Name2"]      # any-of match (case-insensitive per defaults)
#   genre:          ":missing:"             # field is null/empty
#   genre:          ":any:"                 # field is any non-empty value
#   genre_regex:    "(?i)^pattern$"
#   subgenre / subgenre_regex (selbe Sentinels)
#   bpm:            { min: 100, max: 130 }  # skips rule if BPM is null
#   key:            ["8A", "Am"]            # camelot oder standard
#   key_mode:       major | minor
#   energy:         { min: 6, max: 10 }     # skips rule if energy is null
#   artist / artist_regex
#   path_glob:      "**/Promo/**"
#   any_of / all_of / not                   # Boolean composition
#
# Catch-all: `when: {}` (oder `when:` ganz weglassen) matched jede Datei.

version: 1

defaults:
  on_match: stop
  case_sensitive: false

rules:

  # ---------------------------------------------------------------------------
  # 1. Genre-Normalisierung — splittet Multi-Wort-Genres in (Genre, Subgenre)
  #    anhand von `taxonomy.normalise`. Sollte als erste Rule laufen, damit
  #    nachgelagerte Subgenre-basierte Mood-Rules etwas zu matchen haben.
  # ---------------------------------------------------------------------------
  - name: "Normalise multi-word genres → canonical (genre, subgenre)"
    when:
      genre: ":any:"          # SCALAR sentinel — NICHT `[":any:"]` (würde literal matchen)
    set:
      normalise_genre: true
    on_match: continue

  # ---------------------------------------------------------------------------
  # 1b. Crossover-Genres → Reggae/Dancehall. Hierarchische Provider-/Classifier-
  #     Outputs wie "Electronic---Moombahton" werden im Resolver nicht gegen die
  #     taxonomy.normalise-Aliase abgeglichen (nur exact-genre-string-Match).
  #     Diese expliziten Regex-Rules fangen sie ab. `on_match: continue` damit
  #     spätere Set-Position/Mood-Rules weiter feuern können.
  # ---------------------------------------------------------------------------
  - name: "Moombahton crossover → Reggae/Dancehall"
    when:
      genre_regex: "(?i)Moom[bp]a[t]?hon"     # Moombahton, Moombathon
    set:
      genre: "Reggae"
      subgenre: "Dancehall"
    on_match: continue

  - name: "Dub Reggae crossover → Reggae/Dancehall"
    when:
      genre_regex: "(?i)Dub[\\s-]Reggae"      # Dub Reggae, Dub-Reggae
    set:
      genre: "Reggae"
      subgenre: "Dancehall"
    on_match: continue

  - name: "Ragga → Reggae/Dancehall"
    when:
      genre_regex: "(?i)\\bRagga\\b"          # word-boundary guards against partials
    set:
      genre: "Reggae"
      subgenre: "Dancehall"
    on_match: continue

  # ---------------------------------------------------------------------------
  # 2. BPM-Transformationen — DJ-Konvention double/half-time. Greift dort, wo
  #    der Analyzer im falschen Octave gelandet ist und auf die Genre-typische
  #    Range zurückgeholt werden muss.
  # ---------------------------------------------------------------------------
  - name: "Drum & Bass half-time mis-detection → double BPM"
    when:
      genre: ["Drum and Bass"]
      bpm: { min: 60, max: 99 }
    set:
      bpm_transform: double
    on_match: continue

  - name: "DubStep / DnB above 200 → halve BPM"
    when:
      genre: ["Dubstep", "Drum and Bass"]
      bpm: { min: 200, max: 400 }
    set:
      bpm_transform: half
    on_match: continue

  # ---------------------------------------------------------------------------
  # 3. Mood — sonic character. Direkter `set: { mood: ... }` — Wert MUSS in
  #    taxonomy.moods stehen (default-erzwungen). Für freie Custom-Frames
  #    siehe Block 6 unten (`set: { tag.<name>: ... }`).
  #    `on_match: continue` damit Set-Position-Block (4) auch noch feuern kann.
  # ---------------------------------------------------------------------------
  - name: "Driving — Tech House peak slot"
    when:
      any_of:
        - { genre: ["Techno"] }
        - { genre: ["House"], subgenre: ["Tech"] }
      bpm: { min: 124, max: 132 }
    set: { mood: "Driving" }
    on_match: continue

  - name: "Deep — Deep / Soulful House under 124"
    when:
      genre: ["House"]
      subgenre: ["Deep", "Soulful"]
      bpm: { min: 100, max: 124 }
    set: { mood: "Deep" }
    on_match: continue

  - name: "Dark — DubStep default"
    when:
      genre: ["Dubstep"]
    set: { mood: "Dark" }
    on_match: continue

  - name: "Atmospheric — Trip Hop / Ambient fallback"
    when:
      any_of:
        - { genre: ["Trip Hop", "TripHop"] }    # dual-spelling — viele Files kompakt
        - { genre: ["Ambient"] }
    set: { mood: "Atmospheric" }
    on_match: continue

  - name: "Groovy — House fallback (catches all House without specific subgenre)"
    when:
      genre: ["House"]
    set: { mood: "Groovy" }
    on_match: continue

  # ---------------------------------------------------------------------------
  # 4. Set-Position — Funktion von Energy + Tempo. Continue lassen damit
  #    nachträgliche Custom-Tag-Rules (Block 6) auch noch wirken können.
  #    ACHTUNG: Wenn Energy null/nicht analysiert ist, feuert KEINE dieser Rules.
  # ---------------------------------------------------------------------------
  - name: "Warm-up — energy 1-3"
    when: { energy: { min: 1, max: 3 } }
    set: { set_position: "Warm-up" }
    on_match: continue

  - name: "Build-up — energy 4-5"
    when: { energy: { min: 4, max: 5 } }
    set: { set_position: "Build-up" }
    on_match: continue

  - name: "Peak Time — energy 6-8"
    when: { energy: { min: 6, max: 8 } }
    set: { set_position: "Peak Time" }
    on_match: continue

  - name: "Late Peak — energy 9-10"
    when: { energy: { min: 9, max: 10 } }
    set: { set_position: "Late Peak" }
    on_match: continue

  # ---------------------------------------------------------------------------
  # 5. Genre-Konsolidierung — alte / sehr breite Patterns auf canonical reduzieren.
  # ---------------------------------------------------------------------------
  - name: "House family → Electronic"
    when:
      genre: ["House", "Deep House", "Soulful House", "Funky House", "Vocal House"]
    set:
      genre: "Electronic"
      subgenre: "House"

  - name: "Hip-Hop family normalisation (catches HipHop, Hip-Hop, Rap, Trap, …)"
    when:
      any_of:
        - { genre: ["Hip-Hop", "Hip Hop", "HipHop", "Rap"] }
        - { genre_regex: "(?i)^(trap|boom.?bap|conscious.?rap)$" }
    set:
      genre: "Hip Hop"

  # ---------------------------------------------------------------------------
  # 6. Custom-Tag-Schreibungen — `set: { tag.<name>: ... }` schreibt zu einem
  #    benutzerdefinierten TXXX/Vorbis-Frame UND umgeht die taxonomy-Validierung.
  #    Sinnvoll für Labels/Marker, die NICHT in einer kontrollierten Vokabular-
  #    liste stehen sollen.
  # ---------------------------------------------------------------------------
  - name: "Promo-Ordner markieren"
    when:
      path_glob: "**/Promo/**"
    set:
      tag.label: "Promo"
    on_match: continue

  - name: "High-Energy-Marker zusätzlich zu set_position"
    when:
      energy: { min: 9, max: 10 }
    set:
      tag.flavour: "Peak Energy"      # Custom-Frame — keine Taxonomy-Prüfung
    on_match: continue

  # ---------------------------------------------------------------------------
  # 7. Fallback — Tracks ohne Genre nach Analyse + Lookup landen als "Unsorted".
  # ---------------------------------------------------------------------------
  - name: "Default: kein Genre → 'Unsorted'"
    when:
      genre: ":missing:"
    set:
      genre: "Unsorted"

  # ---------------------------------------------------------------------------
  # 8. Optionaler Catch-all — feuert für jeden Track. Aktivieren durch
  #    Auskommentieren. Nützlich z. B. zum Stempeln eines "verarbeitet"-Markers.
  # ---------------------------------------------------------------------------
  # - name: "Verarbeitet-Marker (catch-all)"
  #   when: {}
  #   set:
  #     tag.tagger_processed: "true"
  #   on_match: continue

name: Build Essentia native binaries

# Re-builds essentia_streaming_extractor_music from MTG/essentia@master on a
# monthly cadence and publishes per-RID tarballs as a Tagger release. The
# corresponding `samples/native-tools.example.yaml` update is sent through
# a bot PR rather than committed directly, so each manifest change still
# passes review + the loader/bootstrapper tests before users get it.
#
# License note: the published binaries are AGPL-3.0 (Essentia's license).
# Tagger itself stays Apache-2.0 because the binaries live on the release
# page, not bundled inside the Tagger distribution archive. Each release
# body links back to MTG/essentia at the exact commit SHA to satisfy the
# AGPL source-offer requirement.

on:
  workflow_dispatch:
    inputs:
      essentia_ref:
        description: "Git ref to build (default: master)"
        default: "master"
        required: false
      dry_run:
        description: "If true, build + upload artifacts but skip the release + PR"
        type: boolean
        default: false
  schedule:
    # First day of each month, 06:00 UTC. Catches upstream changes without
    # hammering CI; users can always trigger a fresh build via workflow_dispatch.
    - cron: "0 6 1 * *"

permissions:
  contents: write       # for creating releases
  pull-requests: write  # for the manifest-update PR

jobs:
  build:
    name: Build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: osx-arm64 + linux-x64 are TEMPORARILY commented out while we
          # iterate the win-x64 build. They're known-green from earlier runs;
          # restore in the same commit that lands a working Windows build.
          # - rid: osx-arm64
          #   runner: macos-14
          # osx-x64 (macos-13) is currently DISABLED. Reasons:
          #   1. GitHub is winding down macos-13 Intel runners; queues for private
          #      repos can sit for hours or never pick up.
          #   2. macOS Intel hardware was discontinued by Apple in late 2022; the
          #      Apple-Silicon arm64 build covers ~all new installs.
          # Intel-Mac users install Essentia manually per docs/INSTALL.md until we
          # either (a) re-enable when the repo goes public (better runner allocation),
          # or (b) move to a cross-compile-from-arm64 strategy on macos-14.
          # - rid: osx-x64
          #   runner: macos-13
          #
          # Need FFmpeg 5.1+ for the ch_layout / av_opt_set_chlayout API the current
          # Essentia source assumes. Ubuntu 22.04 ships FFmpeg 4.4 → libavcodec headers
          # are missing those symbols. Ubuntu 24.04 has FFmpeg 6.1.
          # - rid: linux-x64
          #   runner: ubuntu-24.04
          # Windows builds run inside MSYS2/MINGW64. The mingw-w64-x86_64-ffmpeg
          # package tracks upstream FFmpeg so the same source compiles without the
          # ch_layout / codecpar issues we hit on Ubuntu 22.04.
          - rid: win-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Tagger
        uses: actions/checkout@v5

      - name: Checkout Essentia
        uses: actions/checkout@v5
        with:
          repository: MTG/essentia
          ref: ${{ inputs.essentia_ref || 'master' }}
          path: essentia
          fetch-depth: 0  # build script reads commit metadata

      # Essentia's waf wscript does `import distutils.sysconfig`, which was removed
      # from the stdlib in Python 3.12. The macos-14 runner now defaults to Python 3.13,
      # so we pin every Unix runner to 3.11 where distutils is still bundled.
      # Windows uses MSYS2's own Python (installed via setup-msys2 below) — that
      # ships Python 3.11 / 3.12 with distutils-compatible setuptools, so we skip
      # actions/setup-python there.
      - name: Set up Python 3.11
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSYS2 (Windows)
        if: startsWith(matrix.runner, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # tar + git are part of the setup-msys2 bootstrap — listing them here
          # gives "is up to date — skipping" noise without changing the install.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-chromaprint
            mingw-w64-x86_64-python

      - name: Install build deps (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: |
          brew update
          brew install pkg-config eigen libyaml fftw ffmpeg libsamplerate libtag chromaprint dylibbundler

      - name: Install build deps (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              libeigen3-dev libyaml-dev libfftw3-dev \
              libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
              libsamplerate0-dev libtag1-dev libchromaprint-dev

      # Build is split into two steps because GitHub Actions disallows matrix/runner
      # context in the `shell:` key — `if:` is the only place those contexts work,
      # so we gate two near-identical steps instead of one parametrised step.
      - name: Build Essentia (Unix)
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        env:
          ESSENTIA_REPO: ${{ github.workspace }}/essentia
          STAGE_DIR: ${{ runner.temp }}/stage
          TARGET_RID: ${{ matrix.rid }}
          ESSENTIA_REF: ${{ inputs.essentia_ref || 'master' }}
        run: bash .github/scripts/build-essentia.sh

      - name: Build Essentia (Windows / MSYS2)
        if: startsWith(matrix.runner, 'windows')
        shell: "msys2 {0}"
        env:
          ESSENTIA_REPO: ${{ github.workspace }}/essentia
          STAGE_DIR: ${{ runner.temp }}/stage
          TARGET_RID: ${{ matrix.rid }}
          ESSENTIA_REF: ${{ inputs.essentia_ref || 'master' }}
        run: bash .github/scripts/build-essentia.sh

      - name: Smoke-test the built binary (Unix)
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        env:
          STAGE_DIR_RAW: ${{ runner.temp }}/stage
          TARGET_RID: ${{ matrix.rid }}
        run: |
          STAGE="$STAGE_DIR_RAW"
          BIN_NAME="essentia_streaming_extractor_music"
          ARCHIVE=$(ls "$STAGE"/essentia-*-"$TARGET_RID".tar.gz)
          TEST_DIR=$(mktemp -d)
          tar -C "$TEST_DIR" -xzf "$ARCHIVE"
          BIN_DIR=$(find "$TEST_DIR" -name "$BIN_NAME" -exec dirname {} \;)
          "$BIN_DIR/$BIN_NAME" 2>&1 | head -5
          set +e
          "$BIN_DIR/$BIN_NAME"
          rc=$?
          set -e
          if [ $rc -gt 2 ]; then
            echo "Smoke test failed — binary returned $rc"
            exit 1
          fi

      - name: Smoke-test the built binary (Windows / MSYS2)
        if: startsWith(matrix.runner, 'windows')
        shell: "msys2 {0}"
        env:
          STAGE_DIR_RAW: ${{ runner.temp }}/stage
          TARGET_RID: ${{ matrix.rid }}
        run: |
          STAGE=$(cygpath -u "$STAGE_DIR_RAW")
          BIN_NAME="essentia_streaming_extractor_music.exe"
          ARCHIVE=$(ls "$STAGE"/essentia-*-"$TARGET_RID".tar.gz)
          TEST_DIR=$(mktemp -d)
          tar -C "$TEST_DIR" -xzf "$ARCHIVE"
          BIN_DIR=$(find "$TEST_DIR" -name "$BIN_NAME" -exec dirname {} \;)
          "$BIN_DIR/$BIN_NAME" 2>&1 | head -5
          set +e
          "$BIN_DIR/$BIN_NAME"
          rc=$?
          set -e
          if [ $rc -gt 2 ]; then
            echo "Smoke test failed — binary returned $rc"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essentia-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/stage/essentia-*.tar.gz
            ${{ runner.temp }}/stage/essentia-*.sha256
            ${{ runner.temp }}/stage/essentia-*.commit-info.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release + manifest PR
    if: ${{ inputs.dry_run != true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tagger
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        id: flatten
        run: |
          mkdir -p flat
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" -o -name "*.commit-info.txt" \) -exec cp {} flat/ \;
          ls -la flat/
          # All RIDs are expected to share the same commit; assert and capture it.
          COMMIT_SHORTS=$(grep -h '^commit_short=' flat/*.commit-info.txt | sort -u)
          if [ "$(echo "$COMMIT_SHORTS" | wc -l)" -ne 1 ]; then
              echo "RIDs built different commits — refusing to publish"
              echo "$COMMIT_SHORTS"
              exit 1
          fi
          COMMIT_SHORT=$(echo "$COMMIT_SHORTS" | sed 's/^commit_short=//')
          COMMIT_DATE=$(grep -h '^commit_date=' flat/*.commit-info.txt | sort -u | sed 's/^commit_date=//')
          COMMIT_SHA=$(grep -h '^commit_sha=' flat/*.commit-info.txt | sort -u | sed 's/^commit_sha=//')
          RELEASE_TAG="essentia-tools-${COMMIT_DATE}"
          VERSION_LABEL="master-${COMMIT_DATE}-${COMMIT_SHORT}"
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version_label=$VERSION_LABEL" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.flatten.outputs.release_tag }}"
          SHA="${{ steps.flatten.outputs.commit_sha }}"
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          Auto-built Essentia binaries for Tagger's native-tools auto-bootstrap.

          **Source:** MTG/essentia @ \`$SHA\`
          **Built on:** $(date -u +%Y-%m-%d)

          Each tarball contains \`essentia_streaming_extractor_music\` for the given platform plus its non-system runtime dependencies. The binaries are released under AGPL-3.0 (Essentia's license) — see https://github.com/MTG/essentia/tree/$SHA for source.
          EOF
          # If the tag was created earlier in the same month, upload to it; else create.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" flat/*.tar.gz flat/*.sha256 --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" flat/*.tar.gz flat/*.sha256 \
                --repo "${{ github.repository }}" \
                --title "Essentia tools — ${{ steps.flatten.outputs.commit_date }}" \
                --notes-file "$NOTES_FILE"
          fi

      - name: Update native-tools manifest
        run: |
          python3 .github/scripts/update-essentia-manifest.py \
            --manifest samples/native-tools.example.yaml \
            --version "${{ steps.flatten.outputs.version_label }}" \
            --release-tag "${{ steps.flatten.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            flat/*.commit-info.txt

      - name: Open manifest-update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "build(essentia): refresh manifest to ${{ steps.flatten.outputs.version_label }}"
          branch: "automation/essentia-${{ steps.flatten.outputs.commit_date }}"
          base: main
          delete-branch: true
          title: "build(essentia): refresh native-tools manifest to ${{ steps.flatten.outputs.commit_short }}"
          body: |
            Auto-generated by `.github/workflows/essentia-build.yml`.

            - Built MTG/essentia @ `${{ steps.flatten.outputs.commit_sha }}`
            - Attached binaries to release `${{ steps.flatten.outputs.release_tag }}`
            - Rewrote URL + SHA-256 for every RID in the matrix

            Loader/bootstrapper tests will run via the standard CI pipeline. Merge after review.
